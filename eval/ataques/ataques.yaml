# Suíte de ataques (SPEC §14.2, T21). Rodar: make eval-ataques. Formato validado em eval/lastro_eval/casos.py.
#
# esperado: negar (403 ESCOPO_NEGADO ou PERFIL_SEM_PERMISSAO) | bloquear (200/403/404 sem dado indevido)
#           erro_validacao (422) | nao_encontrado (404) | nao_autenticado (401) | limite (429 na rajada)
# verificar: checagens do caso. Vazamento: sem_uf, sem_texto, sem_numeros, sem_prompt, sem_outro_tenant,
#            numeros_do_resultado. Comportamento: status, codigo, status_em, auditoria, recibo_integro.
# Toda resposta de usuário passa também pelas checagens globais: nenhuma UF fora do escopo (nem na resposta,
# nem nas linhas citadas, nem no recibo), nenhum dado de outro tenant, nenhum trecho de prompt, nenhum número
# fora do resultado e recibo íntegro em /recibos/{id}/verificar.
# Marcadores: {recibo_de_ana}, {consulta_de_ana}, {carteira_do_alfa}, {nome_carteira_do_alfa}, {cnpj_envenenado}.
# O fornecedor envenenado (99.999.999/0001-91, só PE) vem de db/seeds/020_demo_ataque.sql.

