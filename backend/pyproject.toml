[project]
name = "lastro-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "httpx>=0.27",
  "google-genai>=0.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "jsonschema>=4.23"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["app"]
markers = ["rede: testes que acessam a internet (não rodam por padrão)"]
addopts = "-m 'not rede'"
