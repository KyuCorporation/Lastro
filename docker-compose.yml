services:
  db:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - ./db/seeds:/seeds:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lastro_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]

  pipeline:
    build: ./pipeline
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lastro_ingest:${INGEST_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./data:/data
    depends_on:
      db: { condition: service_healthy }
    profiles: ["pipeline"]

volumes:
  dbdata:
