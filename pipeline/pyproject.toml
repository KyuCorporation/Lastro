[project]
name = "lastro-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "polars>=1.5",
  "openpyxl>=3.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "tenacity>=9.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
markers = ["rede: testes que acessam a internet (não rodam por padrão)"]
addopts = "-m 'not rede'"
